apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.chatApi.replicas }}
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
        version: v1
    spec:
      containers:
        - name: chat-api
          image: "{{ .Values.chatApi.image }}:{{ .Values.chatApi.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: v1
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: aiworkspace
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-api-secret
                  key: JWT_SECRET
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.chatApi.resources.requests.cpu }}
              memory: {{ .Values.chatApi.resources.requests.memory }}
            limits:
              cpu: {{ .Values.chatApi.resources.limits.cpu }}
              memory: {{ .Values.chatApi.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: chat-api
  ports:
    - port: 8080
      targetPort: 8080
