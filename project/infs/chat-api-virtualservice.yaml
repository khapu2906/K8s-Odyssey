apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: chat-api
  namespace: ai-workspace
spec:
  hosts:
    - chat-api
  http:
    - route:
        - destination:
            host: chat-api
            subset: v1
          weight: 90
        - destination:
            host: chat-api
            subset: v2
          weight: 10
