apiVersion: v1
kind: Pod
metadata:
  name: chat-api
  namespace: ai-workspace
  labels:
    app: chat-api
spec:
  containers:
    - name: chat-api
      image: ai-workspace/chat-api:dev
      ports:
        - containerPort: 8080
      env:
        - name: DATABASE_URL
          value: postgres://postgres:postgres@host.docker.internal:5432/aiworkspace
